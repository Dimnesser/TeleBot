<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Аватарка бота BrainCore (640×640, Telegram обрезает в круг). Рендер: render.js avatar -->
<style>
@font-face { font-family: "OswaldB"; font-weight: 700; src: url(oswald-lat.woff2) format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 640px; height: 640px; overflow: hidden; background: #050b1f; }
.a {
  position: relative; width: 640px; height: 640px; overflow: hidden;
  background:
    radial-gradient(360px 360px at 50% 44%, rgba(60, 140, 255, .65), transparent 70%),
    linear-gradient(160deg, #0b1d52 0%, #06112f 60%, #040a1f 100%);
}
.band { position: absolute; height: 4px; width: 900px; left: -130px; transform: rotate(-24deg);
  background: linear-gradient(90deg, rgba(140,200,255,0), rgba(190,230,255,.9), rgba(140,200,255,0)); box-shadow: 0 0 12px rgba(120,190,255,.9); }
.hex { position: absolute; left: 50%; top: 45%; width: 470px; height: 470px; transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 24px rgba(198,255,61,.75)); }
.hero { position: absolute; left: 50%; top: 47%; height: 380px; transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 18px rgba(90,160,255,.9)) drop-shadow(0 16px 20px rgba(0,0,0,.6)); }
.word { position: absolute; left: 0; right: 0; bottom: 74px; text-align: center; font: 700 76px/1 "OswaldB", sans-serif; letter-spacing: 1px;
  color: #fff; -webkit-text-stroke: 2px #0a1540; text-shadow: 3px 3px 0 #0a1540, 5px 5px 0 #0a1540, 0 0 24px rgba(120,180,255,.8); }
.word b { color: #c6ff3d; text-shadow: 3px 3px 0 #0a1540, 5px 5px 0 #0a1540, 0 0 24px rgba(198,255,61,.7); }
</style>
</head>
<body>
<div class="a">
  <div class="band" style="top:120px; opacity:.55"></div>
  <div class="band" style="top:520px; opacity:.45"></div>
  <svg class="hex" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25z" fill="rgba(9,20,54,.55)" stroke="#c6ff3d" stroke-width="1.3" stroke-linejoin="round"/>
  </svg>
  <img class="hero" src="kraken_crop.png" alt="">
  <div class="word">BRAIN<b>CORE</b></div>
</div>
</body>
</html>
