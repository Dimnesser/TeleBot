<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>BrainCore</title>
<meta name="theme-color" content="#0a0f1e" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;700;800&display=swap" />
<link rel="stylesheet" href="/static/css/app.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="btn-drawer" class="icon-btn" aria-label="Меню"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <button class="brand" id="brand-home" aria-label="BrainCore — на главную">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="5" fill="currentColor"/>
        <path d="M16 11V6.5M20.3 18.5l3.9 2.2M11.7 18.5l-3.9 2.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-word">BRAIN<b>CORE</b></span>
    </button>
    <div class="topbar-balance"><i class="b-coin tok"></i><span id="topbar-tokens">0</span></div>
    <button id="btn-profile" class="icon-btn" aria-label="Профиль"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
  </header>

  <div id="drawer-overlay" class="drawer-overlay hidden"></div>
  <nav id="drawer" class="drawer hidden">
    <button class="drawer-profile" id="drawer-profile" aria-label="Открыть профиль">
      <div class="avatar" id="drawer-avatar"><span>🙂</span></div>
      <div class="drawer-profile-info">
        <div class="drawer-profile-name" id="drawer-username">@игрок</div>
        <div class="drawer-balance"><span id="drawer-balance">0</span> <span class="coin">🪙</span></div>
      </div>
    </button>
    <div class="drawer-items" id="drawer-items"></div>
  </nav>

  <main id="screen" class="screen"></main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>
<script src="/static/js/case-themes.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
